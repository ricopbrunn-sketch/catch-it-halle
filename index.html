<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071923">

  <title>Catch it Live – Halle (Saale)</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Deine CSS-Datei -->
  <link
    rel="stylesheet"
    href="style.css?v=20260913-5"
  >
</head>

<body>

  <div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

      <div>
        <div class="eyebrow">
          ÖPNV HALLE (SAALE)
        </div>

        <h1>
          Catch it <span>Live</span>
        </h1>
      </div>


      <button
        id="locateBtn"
        class="icon-btn"
        type="button"
        aria-label="Karte zentrieren"
      >
        ◎
      </button>

    </header>


    <!-- =====================================================
         SUCHE
    ====================================================== -->

    <section class="search-section">

      <div class="search-wrap">

        <input
          id="stopSearch"
          type="search"
          placeholder="Haltestelle suchen …"
          autocomplete="off"
        >

        <div
          id="searchResults"
          class="search-results hidden"
        ></div>

      </div>


      <!-- ===================================================
           FILTER
      ==================================================== -->

      <div class="filter-row">

        <button
          class="chip active"
          data-filter="all"
          type="button"
        >
          Alle
        </button>

        <button
          class="chip"
          data-filter="tram"
          type="button"
        >
          Tram
        </button>

        <button
          class="chip"
          data-filter="bus"
          type="button"
        >
          Bus
        </button>

      </div>

    </section>


    <!-- =====================================================
         KARTE
    ====================================================== -->

    <main class="map-wrap">

      <div id="map"></div>


      <!-- Status unten auf der Karte -->

      <div class="map-bottom">

        <div class="status-pill">

          <span
            id="statusDot"
            class="status-dot loading"
          ></span>

          <span id="mapStatus">
            Haltestellen werden geladen …
          </span>

        </div>


        <button
          id="refreshBtn"
          class="refresh-btn"
          type="button"
          aria-label="Aktualisieren"
        >
          ↻
        </button>

      </div>

    </main>


    <!-- =====================================================
         ABFAHRTSPANEL
    ====================================================== -->

    <section
      id="panel"
      class="panel"
    >

      <div class="panel-handle"></div>


      <!-- Wenn noch keine Haltestelle ausgewählt wurde -->

      <div
        id="panelEmpty"
        class="panel-empty"
      >

        <strong>
          Haltestelle<br>
          antippen
        </strong>

        <span>
          Dann siehst du hier die nächsten Live-Abfahrten.
        </span>

      </div>


      <!-- Inhalt bei ausgewählter Haltestelle -->

      <div
        id="panelContent"
        class="panel-content hidden"
      >

        <div class="panel-head">

          <div>

            <div class="panel-label">
              Haltestelle
            </div>

            <h2 id="stopName">
              Haltestelle
            </h2>

          </div>


          <button
            id="closePanel"
            class="close-btn"
            type="button"
            aria-label="Panel schließen"
          >
            ×
          </button>

        </div>


        <div id="departures">

          <div class="empty-note">
            Live-Abfahrten werden geladen …
          </div>

        </div>

      </div>

    </section>

  </div>


  <!-- =======================================================
       LEAFLET
  ======================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <!-- =======================================================
       ALTEN PWA-/SERVICE-WORKER-CACHE ENTFERNEN
  ======================================================== -->

  <script>
    async function resetOldCache() {

      try {

        /*
          Alte Service Worker entfernen.
          Genau diese können sonst eine alte app.js liefern.
        */

        if ("serviceWorker" in navigator) {

          const registrations =
            await navigator.serviceWorker.getRegistrations();

          for (const registration of registrations) {
            await registration.unregister();
          }
        }


        /*
          Alte Cache-Storage-Einträge entfernen.
        */

        if ("caches" in window) {

          const cacheNames =
            await caches.keys();

          for (const cacheName of cacheNames) {
            await caches.delete(cacheName);
          }
        }


        console.log(
          "Alter Catch-it-Cache wurde entfernt."
        );

      } catch (error) {

        console.warn(
          "Cache konnte nicht vollständig entfernt werden:",
          error
        );
      }
    }


    async function startApp() {

      await resetOldCache();


      /*
        app.js dynamisch laden.
        Die Versionsnummer sorgt zusätzlich dafür,
        dass Safari/Chrome eine neue Datei anfordert.
      */

      const script =
        document.createElement("script");

      script.src =
        "app.js?v=20260913-5";

      script.defer =
        true;


      script.onerror = () => {

        console.error(
          "app.js konnte nicht geladen werden."
        );


        const status =
          document.getElementById("mapStatus");

        if (status) {
          status.textContent =
            "app.js konnte nicht geladen werden";
        }
      };


      document.body.appendChild(
        script
      );
    }


    startApp();
  </script>

</body>
</html>

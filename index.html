<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <title>Catch it Halle – Live-Karte</title>

  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3yn5Y7p2G8F5VbYIYc6VQfhRSV5c="
        crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">ÖPNV Halle (Saale)</div>
      <h1>Catch it <span>Live</span></h1>
    </div>
    <button id="locateBtn" class="icon-btn" title="Auf Halle zentrieren" aria-label="Auf Halle zentrieren">◎</button>
  </header>

  <main>
    <section class="controls">
      <div class="search-wrap">
        <input id="stopSearch" type="search" placeholder="Haltestelle suchen …" autocomplete="off">
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <div class="chips">
        <button class="chip active" data-filter="all">Alle</button>
        <button class="chip" data-filter="tram">Tram</button>
        <button class="chip" data-filter="bus">Bus</button>
      </div>
    </section>

    <section class="map-card">
      <div id="map"></div>

      <div class="map-status">
        <span id="statusDot" class="status-dot"></span>
        <span id="mapStatus">Lade Haltestellen …</span>
      </div>

      <button id="refreshBtn" class="refresh-btn" type="button">↻</button>
    </section>

    <section id="panel" class="panel">
      <div class="panel-handle"></div>
      <div id="panelEmpty" class="panel-empty">
        <strong>Haltestelle antippen</strong>
        <span>Dann siehst du hier die nächsten Live-Abfahrten.</span>
      </div>

      <div id="panelContent" class="hidden">
        <div class="panel-head">
          <div>
            <div class="eyebrow">Live-Abfahrten</div>
            <h2 id="stopName">Haltestelle</h2>
          </div>
          <button id="closePanel" class="icon-btn">×</button>
        </div>
        <div id="departures" class="departures"></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>

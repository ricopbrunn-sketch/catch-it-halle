<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071923">

  <title>Catch it Live – Halle (Saale)</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="style.css?v=20260913-10"
  >
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="header-title">

        <div class="eyebrow">
          ÖPNV HALLE (SAALE)
        </div>

        <h1>
          Catch it <span>Live</span>
        </h1>

      </div>


      <button
        id="locateBtn"
        class="icon-btn"
        type="button"
        aria-label="Karte auf Halle zentrieren"
      >
        ◎
      </button>

    </header>


    <!-- SUCHE -->
    <section class="search-section">

      <div class="search-wrap">

        <input
          id="stopSearch"
          type="search"
          placeholder="Haltestelle suchen …"
          autocomplete="off"
        >

        <div
          id="searchResults"
          class="search-results hidden"
        ></div>

      </div>


      <!-- FILTER -->
      <div class="filter-row">

        <button
          class="chip active"
          data-filter="all"
          type="button"
        >
          Alle
        </button>

        <button
          class="chip"
          data-filter="tram"
          type="button"
        >
          Tram
        </button>

        <button
          class="chip"
          data-filter="bus"
          type="button"
        >
          Bus
        </button>

      </div>

    </section>


    <!-- KARTE -->
    <main class="map-area">

      <div id="map"></div>


      <!-- STATUS -->
      <div class="map-controls">

        <div class="status-pill">

          <span
            id="statusDot"
            class="status-dot loading"
          ></span>

          <span id="mapStatus">
            Haltestellen werden geladen …
          </span>

        </div>


        <button
          id="refreshBtn"
          class="refresh-btn"
          type="button"
          aria-label="Aktualisieren"
        >
          ↻
        </button>

      </div>

    </main>


    <!-- ABFAHRTSPANEL -->
    <section
      id="panel"
      class="panel"
    >

      <div class="panel-handle"></div>


      <!-- LEER -->
      <div
        id="panelEmpty"
        class="panel-empty"
      >

        <strong>
          Haltestelle<br>
          antippen
        </strong>

        <span>
          Dann siehst du hier die nächsten Live-Abfahrten.
        </span>

      </div>


      <!-- HALTESTELLE GEWÄHLT -->
      <div
        id="panelContent"
        class="panel-content hidden"
      >

        <div class="panel-head">

          <div>

            <div class="panel-label">
              HALTESTELLE
            </div>

            <h2 id="stopName">
              Haltestelle
            </h2>

          </div>


          <button
            id="closePanel"
            class="close-btn"
            type="button"
            aria-label="Schließen"
          >
            ×
          </button>

        </div>


        <div id="departures">

          <div class="empty-note">
            Live-Abfahrten werden geladen …
          </div>

        </div>

      </div>

    </section>

  </div>


  <!-- LEAFLET -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <!-- APP -->
  <script
    src="app.js?v=20260913-10"
  ></script>

</body>

</html>
